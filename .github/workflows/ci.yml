name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    # A throwaway Postgres so migrations are validated and future DB-touching tests can run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkpath
      APP_BASE_URL: http://localhost:3000
      RUN_DB_TESTS: "1" # enables the end-to-end signing-flow integration test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:migrate

      - name: Build
        run: npm run build

      - name: Verify the production entrypoint boots
        # Boots the EXACT command the Heroku web dyno runs (`npm start` -> the built JS), so a
        # mismatch between tsc's emit path and package.json `start` is caught in CI rather than as
        # a dyno crash-loop. Runs against the throwaway Postgres above; NODE_ENV is unset (dev) so
        # no BACKEND_API_KEY is required to boot.
        run: |
          npm start &
          SRV=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$SRV" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "::error::Built server failed to boot via 'npm start'"; exit 1; fi
          echo "Built entrypoint booted and served /health OK"

      - name: Test
        run: npm test
